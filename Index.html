$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('today').onclick=()=>{day=kst();render()};$('day').onchange=e=>{if(e.target.value){day=e.target.value;render()}};$('refresh').onclick=()=>{if(dirty&&!confirm('작성 중인 입력을 버리고 원장을 다시 읽을까요?'))return;dirty=false;if(gas)fetchLive();else{loadDemo();render();toast('이 기기의 시안 기록을 다시 읽었습니다.')}};$('guestBtn').onclick=openGuest;$('guestBack').onclick=closeGuest;$('connectBtn').onclick=openConn;$('closeConn').onclick=()=>$('connectionDialog').close();$('roleBtn').onclick=()=>{if(!gas){role={owner:'staff',staff:'strategist',strategist:'owner'}[role];render();toast('시안 역할 전환 · 실제 인증 아님')}};$('exportBtn').onclick=()=>{let list=records.filter(r=>r.unit===unit&&r.date===day);if(role==='staff')list=list.filter(r=>!['ad_stat','sales'].includes(r.type)).map(r=>({...r,payload:Object.fromEntries(Object.entries(r.payload).filter(([k])=>!['budget','cost','amount'].includes(k)))}));let blob=new Blob([JSON.stringify({mode:demo?'DEMO':'SHEETS',unit,day,records:list},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ARVO_CONNECT_${unit}_${day}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
if(gas){render();fetchLive();setInterval(()=>{if(document.visibilityState==='visible'&&!busy&&!dirty&&!document.querySelector('#panel form:focus-within')&&!$('connectionDialog').open&&$('guestScreen').classList.contains('hidden'))fetchLive()},15000)}else{loadDemo();render()}
